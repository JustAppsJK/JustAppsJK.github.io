<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperyment: Czas Reakcji - Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a3a5f;
            --accent-blue: #3498db;
            --bg-page: #ffffff;
            --card-bg: #f8fafc;
            --text-dark: #2c3e50;
            --border-color: #e2e8f0;
            --success-green: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--primary-blue); 
            color: var(--text-dark);
            min-height: 100vh;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 40px;
        }

        .nav-links a { text-decoration: none; color: var(--primary-blue); font-weight: 600; font-size: 0.9rem; }

        .main-content { padding: 40px; max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: var(--primary-blue); font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #64748b; font-size: 0.95rem; }

        /* Panel Eksperymentu */
        .experiment-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            text-align: center;
        }


.stats-bar {
    display: flex;
    justify-content: center; 
    gap: 40px;               
    margin-bottom: 30px;
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}

.stat-item { 
    font-weight: 600; 
    color: var(--primary-blue);
    width: 140px;            
    text-align: left;        
    white-space: nowrap;     
}

.stat-item span { 
    color: var(--accent-blue); 
    font-size: 1.2rem;
    font-family: 'Courier New', Courier, monospace; 
    display: inline-block;
    min-width: 50px;        
}

        .game-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            min-height: 120px;
        }

        .btn-target {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #cbd5e1;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .btn-target.active {
            background: var(--success-green);
            border-color: #27ae60;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        /* Przyciski sterujące */
        .btn-main {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-main:hover { background: var(--accent-blue); }

        .advanced-link {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 50px;

            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px dashed var(--accent-blue);
        }
        .back-container { text-align: center; margin-top: 50px; padding-bottom: 40px; }

        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="page-wrapper">
        </nav>

        <main class="main-content">
            <div class="header">
                <h2>Programowanie Eksperymentów</h2>
                <p>Przykład prostego testu mierzącego czas reakcji.</p>
            </div>

            <div class="experiment-card">
                <!-- Statystyki -->
<!-- Statystyki z poprawioną strukturą -->
<div class="stats-bar">
    <div class="stat-item">
        <span id="timer">0.0</span>s
    </div>
    <div class="stat-item">
        Poprawne: <span id="score">0</span>
    </div>
</div>
                <!-- Ekran Startowy -->
                <div id="start-screen">
                    <p style="margin-bottom: 20px; color: #475569;">Kliknij przycisk, który zaświeci się na zielono tak szybko, jak to możliwe.</p>
                    <button class="btn-main" onclick="startGame()">ROZPOCZNIJ TEST</button>
                </div>

                <!-- Obszar Gry -->
                <div id="game-screen" class="hidden">
                    <div class="game-area">
                        <button class="btn-target" id="target-0" onclick="checkClick(0)"></button>
                        <button class="btn-target" id="target-1" onclick="checkClick(1)"></button>
                        <button class="btn-target" id="target-2" onclick="checkClick(2)"></button>
                    </div>
                </div>
            </div>

            <div class="header">
                <a href="https://play.google.com/store/apps/dev?id=5700654377016469645" class="advanced-link">
                    Tworzę również bardziej rozbudowane gry, które publikuje na Google Play Store. 
                </a>
            </div>


            <div class="back-container">
                <a href="../demo.html" class="back-link">← Powrót do listy projektów</a>
            </div>
        </main>
    </div>

    <script>
        let score = 0;
        let startTime;
        let gameActive = false;
        let currentTarget = -1;
        let timerInterval;

        function startGame() {
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            gameActive = true;
            startTimer();
            nextRound();
        }

        function startTimer() {
            let totalTime = 0;
            timerInterval = setInterval(() => {
                totalTime += 0.1;
                document.getElementById('timer').textContent = totalTime.toFixed(1);
            }, 100);
        }

        function nextRound() {
            document.querySelectorAll('.btn-target').forEach(b => b.classList.remove('active'));
            
            const delay = Math.random() * 1500 + 500;
            
            setTimeout(() => {
                if (!gameActive) return;
                currentTarget = Math.floor(Math.random() * 3);
                document.getElementById(`target-${currentTarget}`).classList.add('active');
            }, delay);
        }

        function checkClick(index) {
            if (!gameActive || index !== currentTarget) return;

            // Jeśli trafiony
            if (document.getElementById(`target-${index}`).classList.contains('active')) {
                score++;
                document.getElementById('score').textContent = score;
                document.getElementById(`target-${index}`).classList.remove('active');
                currentTarget = -1;
                
                if (score >= 5) {
                    endGame();
                } else {
                    nextRound();
                }
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            alert("Test zakończony! Twój czas dla 5 prób to: " + document.getElementById('timer').textContent + "s");
            location.reload(); 
        }
    </script>
</body>
</html>
